<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タスク一覧（閲覧用）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:14px}
header{background:#1e293b;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:15px;font-weight:600}
#refresh-info{font-size:11px;opacity:.8}
#reload-btn{background:#3b82f6;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:8px;white-space:nowrap}
.filters{padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid #cbd5e1;background:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.fbtn.active{background:#1e293b;color:#fff;border-color:#1e293b}
.container{padding:10px 12px;max-width:900px;margin:0 auto}
.section{margin-bottom:16px}
.section-title{font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;padding:4px 0;border-bottom:1px solid #e2e8f0}
.card{background:#fff;border-radius:8px;margin-bottom:6px;border-left:4px solid #94a3b8;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header{padding:10px 12px;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.card-main{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4;word-break:break-all}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:#64748b;align-items:center}
.badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-新規{background:#dbeafe;color:#1d4ed8}
.badge-完了{background:#f1f5f9;color:#64748b}
.badge-保留{background:#fefce8;color:#a16207}
.badge-継続中{background:#f0fdf4;color:#15803d}
.badge-依頼中{background:#fdf4ff;color:#7e22ce}
.badge-定期{background:#fff7ed;color:#c2410c}
.deadline.urgent{color:#ef4444;font-weight:600}
.deadline.warn{color:#f97316;font-weight:600}
.deadline.ok{color:#16a34a}
.card-actions{display:flex;gap:4px;flex-shrink:0;align-items:flex-start;margin-top:2px}
.url-btn{background:#3b82f6;color:#fff;border:none;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;white-space:nowrap;text-decoration:none;display:inline-block;line-height:1.6}
.expand-btn{background:#f1f5f9;color:#475569;border:none;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;white-space:nowrap}
.card-body{padding:0 12px 10px;display:none;border-top:1px solid #f1f5f9}
.card-body.open{display:block}
.detail-row{padding:5px 0;display:flex;gap:6px;font-size:12px;border-bottom:1px solid #f8fafc}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#94a3b8;min-width:80px;flex-shrink:0;font-size:11px;padding-top:2px}
.detail-value{color:#1a1a2e;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.next-action{color:#2563eb;font-weight:500}
.empty{text-align:center;padding:40px;color:#94a3b8;font-size:14px}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:16px;margin:16px 0;color:#991b1b;font-size:13px;line-height:1.7}
.cat-防災{border-left-color:#ef4444}
.cat-OA{border-left-color:#3b82f6}
.cat-設備{border-left-color:#f97316}
.cat-人事{border-left-color:#8b5cf6}
.cat-その他{border-left-color:#94a3b8}
@media(min-width:600px){
  .container{padding:14px 20px}
  .card-title{font-size:14px}
  .badge{font-size:11px}
  .url-btn,.expand-btn{font-size:12px;padding:5px 10px}
}
</style>
</head>
<body>
<header>
  <h1>📋 タスク一覧（閲覧用）</h1>
  <div style="display:flex;align-items:center">
    <span id="refresh-info">読み込み中...</span>
    <button id="reload-btn" onclick="loadData()">🔄 更新</button>
  </div>
</header>
<div class="filters">
  <button class="fbtn active" onclick="setFilter(this,'active')">進行中</button>
  <button class="fbtn" onclick="setFilter(this,'all')">全タスク</button>
  <button class="fbtn" onclick="setFilter(this,'防災')">🔴 防災</button>
  <button class="fbtn" onclick="setFilter(this,'OA')">🔵 OA</button>
  <button class="fbtn" onclick="setFilter(this,'設備')">🟠 設備</button>
  <button class="fbtn" onclick="setFilter(this,'人事')">🟣 人事</button>
  <button class="fbtn" onclick="setFilter(this,'その他')">⚪ その他</button>
</div>
<div class="container" id="container"><div class="empty" style="padding-top:60px">⏳ 読み込み中...</div></div>

<script>
var allTasks=[], currentFilter='active';

function setFilter(btn,f){
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  currentFilter=f;
  render();
}

function deadlineClass(d){
  if(!d) return '';
  var diff=(new Date(d)-new Date())/86400000;
  if(diff<0) return 'urgent';
  if(diff<=3) return 'warn';
  return 'ok';
}

function toggleCard(id){
  var body=document.getElementById('b'+id);
  var btn=document.getElementById('e'+id);
  if(!body||!btn) return;
  if(body.classList.contains('open')){body.classList.remove('open');btn.textContent='▼ 詳細';}
  else{body.classList.add('open');btn.textContent='▲ 閉じる';}
}

function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  var tasks=allTasks.filter(function(t){
    if(currentFilter==='active') return t.kind!=='完了';
    if(currentFilter==='all') return true;
    return t.cat===currentFilter;
  });
  if(tasks.length===0){
    document.getElementById('container').innerHTML='<div class="empty">表示するタスクがありません</div>';
    return;
  }
  var groups={};
  tasks.forEach(function(t){
    var k=t.cat||'その他';
    if(!groups[k]) groups[k]=[];
    groups[k].push(t);
  });
  var html='';
  ['防災','OA','設備','人事','その他'].forEach(function(cat){
    if(!groups[cat]||!groups[cat].length) return;
    html+='<div class="section"><div class="section-title">'+esc(cat)+'関係（'+groups[cat].length+'件）</div>';
    groups[cat].forEach(function(t,gi){
      var uid='t'+(t.id||(cat+gi)).replace(/[^a-z0-9]/gi,'');
      var dc=deadlineClass(t.deadline);
      var mp=t.memo?(t.memo.length>55?t.memo.slice(0,55)+'…':t.memo):'';
      html+='<div class="card cat-'+esc(t.cat||'その他')+'">';
      html+='<div class="card-header" onclick="toggleCard(\''+uid+'\')"><div class="card-main">';
      html+='<div class="card-title"><span class="badge badge-'+esc(t.kind)+'">'+esc(t.kind)+'</span> '+esc(t.name)+'</div>';
      html+='<div class="card-meta">';
      if(t.deadline) html+='<span class="deadline '+dc+'">📅 '+esc(t.deadline)+'</span>';
      if(t.person) html+='<span>👤 '+esc(t.person)+'</span>';
      if(mp) html+='<span>'+esc(mp)+'</span>';
      html+='</div></div>';
      html+='<div class="card-actions">';
      if(t.url) html+='<a class="url-btn" href="'+esc(t.url)+'" target="_blank" onclick="event.stopPropagation()">🔗 開く</a>';
      html+='<button class="expand-btn" id="e'+uid+'" onclick="event.stopPropagation();toggleCard(\''+uid+'\')">▼ 詳細</button></div></div>';
      html+='<div class="card-body" id="b'+uid+'">';
      if(t.memo) html+='<div class="detail-row"><span class="detail-label">メモ</span><span class="detail-value">'+esc(t.memo)+'</span></div>';
      if(t.next) html+='<div class="detail-row"><span class="detail-label">次のアクション</span><span class="detail-value next-action">'+esc(t.next)+'</span></div>';
      if(t.priority) html+='<div class="detail-row"><span class="detail-label">優先度</span><span class="detail-value">'+esc(t.priority)+'</span></div>';
      html+='</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('container').innerHTML=html;
}

function loadData(){
  document.getElementById('refresh-info').textContent='読み込み中...';
  var url='https://task-manager.tsukasa-kihara.workers.dev/api/data?_='+Date.now();
  fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(!data.T) throw new Error('データ形式エラー: T key missing');
      allTasks=data.T;
      var now=new Date().toLocaleTimeString('ja-JP');
      document.getElementById('refresh-info').textContent=now+' ('+allTasks.length+'件)';
      render();
    })
    .catch(function(e){
      document.getElementById('refresh-info').textContent='エラー';
      document.getElementById('container').innerHTML='<div class="err-box">❌ データ取得失敗<br>'+e.message+'<br><br>ネットワーク接続を確認して🔄更新ボタンを押してください。</div>';
    });
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
